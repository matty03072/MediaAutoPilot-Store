  - https://raw.githubusercontent.com/matty03072/MediaAutoPilot-Store/main/assets/overview.png
  - https://raw.githubusercontent.com/matty03072/MediaAutoPilot-Store/main/assets/member.png
  - https://raw.githubusercontent.com/matty03072/MediaAutoPilot-Store/main/assets/invitations.png
path: /setup
