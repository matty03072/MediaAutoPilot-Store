services:
  app_proxy:
    environment:
      APP_HOST: mediaautopilot-map_web_1
      APP_PORT: 8099
  web:
    image: ghcr.io/matty03072/mediaautopilot:v1.0.2@sha256:29b153ecb9c5dd84705c1e018338285adcd8a9f4f77d7046b57cc2623a7b2d67
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      UMBREL_BOOTSTRAP_PASSWORD: ${APP_PASSWORD}
      PUBLIC_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
    volumes:
      - ${APP_DATA_DIR}/data/state:/state
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  worker:
    image: ghcr.io/matty03072/mediaautopilot:v1.0.2@sha256:29b153ecb9c5dd84705c1e018338285adcd8a9f4f77d7046b57cc2623a7b2d67
    command: [worker]
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      UMBREL_BOOTSTRAP_PASSWORD: ${APP_PASSWORD}
      PUBLIC_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
    volumes:
      - ${APP_DATA_DIR}/data/state:/state
    depends_on:
      web:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
